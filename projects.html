<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Lucas Antunes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="card">
    <div>
      <p class="mono"><a href="index.html">← Lucas Antunes</a></p>
      <h1>Projects</h1>
      <div class="filters" role="group" aria-label="Show categories">
        <button class="chip" id="all">All</button>
        <label class="chip"><input type="checkbox" value="networking" checked> Networking</label>
        <label class="chip"><input type="checkbox" value="system-design" checked> System Design</label>
        <label class="chip"><input type="checkbox" value="misc" checked> Miscellaneous</label>
      </div>
    </div>
  </header>

  <main>
    <p class="card meta" id="none" hidden>No categories selected. Pick one above, or press All.</p>
    <div class="grid" id="projects"></div>
  </main>

  <dialog id="view" aria-labelledby="view-title">
    <div>
      <button class="btn" id="close">← Back</button>
      <h1 id="view-title"></h1>
      <p class="meta mono" id="view-meta"></p>
      <div class="slides">
        <img id="slide" alt="">
        <button class="btn prev" aria-label="Previous screenshot">‹</button>
        <button class="btn next" aria-label="Next screenshot">›</button>
      </div>
      <p class="meta" id="slide-count"></p>
      <div id="view-details"></div>
    </div>
  </dialog>

  <script src="projects.js"></script>
  <script>
    const view = document.getElementById("view");
    const slide = document.getElementById("slide");
    let current, index = 0;

    function el(tag, text) {
      const e = document.createElement(tag);
      e.textContent = text;
      return e;
    }

    function showSlide(step) {
      const imgs = current.images;
      index = (index + step + imgs.length) % imgs.length;
      slide.src = imgs[index];
      slide.alt = `${current.title}, screenshot ${index + 1} of ${imgs.length}`;
      document.getElementById("slide-count").textContent = `${index + 1} / ${imgs.length}`;
      view.querySelectorAll(".slides .btn").forEach(b => b.hidden = imgs.length < 2);
    }

    function open(p) {
      current = p;
      index = 0;
      document.getElementById("view-title").textContent = p.title;
      const meta = document.getElementById("view-meta");
      meta.replaceChildren(`${p.date} · ${p.tech}`);
      if (p.github) {
        const a = el("a", "GitHub ↗");
        a.href = p.github;
        meta.append(" · ", a);
      }
      document.getElementById("view-details").innerHTML = p.details; // trusted: written by hand in projects.js
      showSlide(0);
      view.showModal();
      view.scrollTop = 0;
    }

    const grid = document.getElementById("projects");
    for (const p of PROJECTS) {
      const box = document.querySelector(`.filters input[value="${p.category}"]`);
      // catches typos in projects.js, e.g. category: "networkng"
      if (!box || !p.title || !p.images?.length) { console.error("Bad project entry in projects.js:", p); continue; }
      const card = document.createElement("button");
      card.className = "card";
      card.dataset.category = p.category;
      const tag = el("span", box.parentElement.textContent.trim());
      tag.className = "tag";
      card.append(tag, el("h3", p.title), el("p", p.summary));
      card.lastChild.className = "meta";
      card.onclick = () => open(p);
      grid.append(card);
    }

    // category filter: each checkbox shows or hides the cards of its category
    const boxes = [...document.querySelectorAll(".filters input")];
    function applyFilter() {
      const on = boxes.filter(b => b.checked).map(b => b.value);
      for (const card of grid.children) card.hidden = !on.includes(card.dataset.category);
      document.getElementById("none").hidden = on.length > 0;
      document.getElementById("all").classList.toggle("on", boxes.every(b => b.checked));
    }
    boxes.forEach(b => b.onchange = applyFilter);
    document.getElementById("all").onclick = () => { boxes.forEach(b => b.checked = true); applyFilter(); };
    // from a home page cell (projects.html#networking): only that category; otherwise all
    const start = boxes.find(b => "#" + b.value === location.hash);
    boxes.forEach(b => b.checked = !start || b === start);
    applyFilter();

    document.getElementById("close").onclick = () => view.close();
    view.querySelector(".prev").onclick = () => showSlide(-1);
    view.querySelector(".next").onclick = () => showSlide(1);
    view.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") showSlide(-1);
      if (e.key === "ArrowRight") showSlide(1);
    });
  </script>
</body>
</html>
